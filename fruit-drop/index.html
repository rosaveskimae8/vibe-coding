<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Drop</title>
<style>
  :root {
    --bg: #fff7ec;
    --panel: #ffffff;
    --text: #4a3428;
    --accent: #ff7a59;
    --border: #d9b99b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 12px;
    user-select: none;
    -webkit-user-select: none;
  }
  h1 { margin: 4px 0 8px; font-size: 30px; letter-spacing: 1px; }
  .themes { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
  .themes button, .btn {
    border: 2px solid #e8d6c4; background: #fff; border-radius: 999px;
    padding: 6px 14px; font-size: 15px; cursor: pointer; color: var(--text);
    font-family: inherit;
  }
  .themes button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.main { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .game { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  .board { position: relative; }
  canvas {
    display: block;
    width: min(400px, 92vw);
    height: auto;
    aspect-ratio: 400 / 600;
    background: linear-gradient(#fffdf8, #ffeedd);
    border: 4px solid var(--border);
    border-radius: 16px;
    touch-action: none;
    cursor: pointer;
  }
  .side { display: flex; flex-direction: column; gap: 10px; width: 190px; }
  .card { background: var(--panel); border-radius: 14px; padding: 10px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .card h3 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; opacity: .65; letter-spacing: .5px; }
  .big { font-size: 28px; font-weight: 700; }
  .small { font-size: 13px; opacity: .7; }
  .next { display: flex; align-items: center; gap: 10px; }
  .emo {
    font-size: 38px; width: 58px; height: 58px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .emo.mini { font-size: 24px; width: 38px; height: 38px; }
  .chain { display: flex; flex-direction: column; gap: 3px; font-size: 15px; }
  .chain div { display: flex; align-items: center; gap: 4px; opacity: .45; }
  .chain div.done { opacity: 1; }
  .chain .e { font-size: 21px; width: 26px; text-align: center; }
  label.toggle { display: flex; gap: 6px; align-items: center; font-size: 14px; cursor: pointer; }
  .overlay {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    background: rgba(255, 247, 236, .88); border-radius: 16px; text-align: center; padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 30px; }
  .toast {
    position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
    background: var(--accent); color: #fff; padding: 8px 16px; border-radius: 999px;
    font-weight: 700; font-size: 18px; opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .help { max-width: 600px; font-size: 13px; opacity: .7; text-align: center; margin-top: 12px; line-height: 1.5; }
  @media (max-width: 640px) {
    .side { width: min(400px, 92vw); flex-direction: row; flex-wrap: wrap; }
    .side .card { flex: 1 1 45%; }
  }
</style>
</head>
<body>

<h1 id="title">Fruit Drop</h1>
<div class="themes" id="themes"></div>

<div class="game">
  <div class="board">
    <canvas id="cv"></canvas>
    <div class="toast" id="toast"></div>
    <div class="overlay" id="overlay">
      <h2>Игра окончена!</h2>
      <div>Твои очки: <b id="finalScore">0</b></div>
      <div class="small" id="finalBest"></div>
      <button class="btn main" id="againBtn">Играть снова</button>
    </div>
  </div>

  <div class="side">
    <div class="card">
      <h3>Очки</h3>
      <div class="big" id="score">0</div>
      <div class="small">Рекорд: <span id="best">0</span></div>
    </div>

    <div class="card">
      <h3>Сейчас в руке</h3>
      <div class="next">
        <div class="emo" id="curEmo"></div>
        <div id="curName"></div>
      </div>
    </div>

    <div class="card">
      <h3>Следующий 👀</h3>
      <div class="next">
        <div class="emo mini" id="nextEmo"></div>
        <div id="nextName"></div>
      </div>
    </div>

    <div class="card">
      <h3>Что во что сливается</h3>
      <div class="chain" id="chain"></div>
    </div>

    <div class="card">
      <label class="toggle"><input type="checkbox" id="guideToggle" checked> Линия прицела</label>
      <div style="height:8px"></div>
      <button class="btn" id="newBtn" style="width:100%">Новая игра</button>
    </div>
  </div>
</div>

<div class="help">
  Веди мышкой (или пальцем) и нажми, чтобы уронить. Клавиатура: ← → и пробел.<br>
  Два одинаковых соединяются в следующий, побольше. Не дай им подняться выше красной линии!
</div>

<script>
// ===================== ТЕМЫ =====================
// Каждая тема — 6 предметов от самого маленького к самому большому.
const THEMES = {
  fruits: {
    button: '🍓 Фрукты', title: 'Fruit Drop',
    items: [
      { e: '🫐', n: 'Голубика', c: '#c5cdf5' },
      { e: '🍓', n: 'Клубника', c: '#ffc9d2' },
      { e: '🍊', n: 'Апельсин', c: '#ffd8a8' },
      { e: '🍋', n: 'Лимон',    c: '#fff3a8' },
      { e: '🍍', n: 'Ананас',   c: '#e3f0a6' },
      { e: '🍉', n: 'Арбуз',    c: '#b8ebc0' },
    ]
  },
  flowers: {
    button: '🌸 Цветы', title: 'Flower Drop',
    items: [
      { e: '🌼', n: 'Ромашка',   c: '#fff3bf' },
      { e: '🌸', n: 'Сакура',    c: '#ffe0ec' },
      { e: '🌷', n: 'Тюльпан',   c: '#ffc9dc' },
      { e: '🌹', n: 'Роза',      c: '#ffc2c2' },
      { e: '🌺', n: 'Гибискус',  c: '#f9c6dc' },
      { e: '🌻', n: 'Подсолнух', c: '#ffe58f' },
    ]
  },
  sweets: {
    button: '🍬 Сладости', title: 'Sweet Drop',
    items: [
      { e: '🍬', n: 'Конфета',  c: '#d6ecff' },
      { e: '🍪', n: 'Печенье',  c: '#f1dcc0' },
      { e: '🍩', n: 'Пончик',   c: '#ffd6e5' },
      { e: '🧁', n: 'Капкейк',  c: '#e7d8ff' },
      { e: '🍰', n: 'Пирожное', c: '#fff0d6' },
      { e: '🎂', n: 'Торт',     c: '#ffe0e0' },
    ]
  }
};

const RADII  = [18, 26, 35, 45, 57, 72];   // размеры шариков
const POINTS = [1, 3, 6, 10, 15, 21];      // очки за получение предмета
const BIG_BONUS = 100;                      // очки за слияние двух самых больших

// ===================== НАСТРОЙКИ ПОЛЯ =====================
const W = 400, H = 600;
const TOP_LINE = 100;   // красная линия
const DROP_Y = 50;      // откуда падает
const GRAVITY = 1400;
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const dpr = window.devicePixelRatio || 1;
cv.width = W * dpr;
cv.height = H * dpr;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

// ===================== СОСТОЯНИЕ =====================
let theme = 'fruits';
let balls = [], pending = [], particles = [], floaters = [];
let score = 0, best = 0, maxReached = 0;
let cur = 0, nxt = 0;
let aimX = W / 2, cooldown = 0;
let over = false, overTimer = 0;
let showGuide = true;

const items = () => THEMES[theme].items;
const randLevel = () => Math.floor(Math.random() * 3); // падают только 3 самых маленьких

function loadBest() {
  try { best = parseInt(localStorage.getItem('fruitdrop_best_' + theme)) || 0; } catch (e) { best = 0; }
}
function saveBest() {
  try { localStorage.setItem('fruitdrop_best_' + theme, best); } catch (e) {}
}

function newGame() {
  balls = []; pending = []; particles = []; floaters = [];
  score = 0; maxReached = 0; over = false; overTimer = 0; cooldown = 0;
  cur = randLevel(); nxt = randLevel();
  aimX = W / 2;
  loadBest();
  document.getElementById('overlay').classList.remove('show');
  updateUI();
}

// ===================== УПРАВЛЕНИЕ =====================
function clampAim() {
  const r = RADII[cur];
  aimX = Math.max(r, Math.min(W - r, aimX));
}
function pointerToX(e) {
  const rect = cv.getBoundingClientRect();
  return (e.clientX - rect.left) * W / rect.width;
}
let pressing = false;
cv.addEventListener('pointerdown', e => { pressing = true; aimX = pointerToX(e); clampAim(); });
cv.addEventListener('pointermove', e => { aimX = pointerToX(e); clampAim(); });
cv.addEventListener('pointerup', e => { if (pressing) { aimX = pointerToX(e); clampAim(); drop(); } pressing = false; });
cv.addEventListener('pointerleave', () => { pressing = false; });

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  { aimX -= 14; clampAim(); e.preventDefault(); }
  if (e.key === 'ArrowRight') { aimX += 14; clampAim(); e.preventDefault(); }
  if (e.key === ' ' || e.key === 'Enter') { drop(); e.preventDefault(); }
});

function drop() {
  if (over || cooldown > 0) return;
  clampAim();
  balls.push(makeBall(aimX, DROP_Y, cur, 0, 0, 1));
  cur = nxt;
  nxt = randLevel();
  clampAim();
  cooldown = 0.55;
  updateUI();
}

function makeBall(x, y, lvl, vx, vy, grow) {
  return { x, y, vx, vy, lvl, r: RADII[lvl], age: 0, angle: 0, dead: false, grow };
}

// ===================== ФИЗИКА =====================
function step(dt) {
  for (const b of balls) {
    b.vy += GRAVITY * dt;
    b.vx *= 0.998;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.age += dt;
    b.angle += b.vx * dt / b.r;
    if (b.grow < 1) b.grow = Math.min(1, b.grow + dt * 6);
  }
  for (let it = 0; it < 6; it++) {
    for (let i = 0; i < balls.length; i++) {
      for (let j = i + 1; j < balls.length; j++) collide(balls[i], balls[j]);
    }
    for (const b of balls) walls(b);
  }
  if (pending.length || balls.some(b => b.dead)) {
    balls = balls.filter(b => !b.dead).concat(pending);
    pending = [];
  }
}

function collide(a, b) {
  if (a.dead || b.dead) return;
  const dx = b.x - a.x, dy = b.y - a.y;
  const min = a.r + b.r;
  const d2 = dx * dx + dy * dy;
  if (d2 >= min * min) return;

  if (a.lvl === b.lvl) { merge(a, b); return; }

  const d = Math.sqrt(d2) || 0.01;
  const nx = dx / d, ny = dy / d;
  const overlap = min - d;
  const ma = a.r * a.r, mb = b.r * b.r, sum = ma + mb;
  a.x -= nx * overlap * mb / sum; a.y -= ny * overlap * mb / sum;
  b.x += nx * overlap * ma / sum; b.y += ny * overlap * ma / sum;

  const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
  if (rv < 0) {
    const j = -1.15 * rv / (1 / ma + 1 / mb);
    a.vx -= j * nx / ma; a.vy -= j * ny / ma;
    b.vx += j * nx / mb; b.vy += j * ny / mb;
  }
}

function walls(b) {
  if (b.x < b.r)     { b.x = b.r;     if (b.vx < 0) b.vx *= -0.3; }
  if (b.x > W - b.r) { b.x = W - b.r; if (b.vx > 0) b.vx *= -0.3; }
  if (b.y > H - b.r) { b.y = H - b.r; if (b.vy > 0) b.vy *= -0.2; b.vx *= 0.99; }
}

function merge(a, b) {
  a.dead = b.dead = true;
  const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
  const L = a.lvl + 1;
  burst(x, y, a.lvl);
  if (L >= RADII.length) {
    score += BIG_BONUS;
    floatText(x, y, '+' + BIG_BONUS);
    toast('💥 Супер! +' + BIG_BONUS);
  } else {
    pending.push(makeBall(x, y, L, (a.vx + b.vx) / 2, (a.vy + b.vy) / 2 - 80, 0.5));
    score += POINTS[L];
    floatText(x, y, '+' + POINTS[L]);
    if (L > maxReached) {
      maxReached = L;
      if (L >= 3) toast('Новый: ' + items()[L].e + ' ' + items()[L].n + '!');
      updateUI();
    }
  }
}

// ===================== ЭФФЕКТЫ =====================
function burst(x, y, lvl) {
  const color = items()[lvl].c;
  for (let i = 0; i < 12; i++) {
    const ang = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 160;
    particles.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 0.5, color, r: 3 + Math.random() * 4 });
  }
}
function floatText(x, y, text) { floaters.push({ x, y, text, life: 0.9 }); }

let toastTimer = null;
function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1300);
}

// ===================== КОНЕЦ ИГРЫ =====================
function checkOver(dt) {
  let danger = false;
  for (const b of balls) {
    if (b.age > 1.2 && b.y - b.r < TOP_LINE) { danger = true; break; }
  }
  overTimer = danger ? overTimer + dt : 0;
  if (overTimer > 2) gameOver();
}
function gameOver() {
  over = true;
  if (score > best) { best = score; saveBest(); }
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalBest').textContent = score >= best && score > 0 ? '🏆 Новый рекорд!' : 'Рекорд: ' + best;
  document.getElementById('overlay').classList.add('show');
}

// ===================== РИСОВАНИЕ =====================
function drawItem(x, y, lvl, r, angle, alpha) {
  const it = items()[lvl];
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = it.c;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(0,0,0,.12)';
  ctx.stroke();
  ctx.rotate(angle);
  ctx.font = Math.round(r * 1.3) + 'px ' + EMOJI_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(it.e, 0, r * 0.08);
  ctx.restore();
}

function draw(time) {
  ctx.clearRect(0, 0, W, H);

  // красная линия (мигает, если опасно)
  ctx.save();
  ctx.setLineDash([10, 7]);
  ctx.lineWidth = 2;
  const flash = overTimer > 0 && Math.floor(time / 150) % 2 === 0;
  ctx.strokeStyle = flash ? 'rgba(255,40,40,1)' : 'rgba(255,77,77,.45)';
  ctx.beginPath(); ctx.moveTo(0, TOP_LINE); ctx.lineTo(W, TOP_LINE); ctx.stroke();
  ctx.restore();

  // линия прицела
  if (!over && showGuide) {
    ctx.save();
    ctx.setLineDash([4, 8]);
    ctx.strokeStyle = 'rgba(74,52,40,.25)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(aimX, DROP_Y); ctx.lineTo(aimX, H); ctx.stroke();
    ctx.restore();
  }

  for (const b of balls) drawItem(b.x, b.y, b.lvl, b.r * b.grow, b.angle, 1);

  // предмет в руке
  if (!over) drawItem(aimX, DROP_Y, cur, RADII[cur], 0, cooldown > 0 ? 0.4 : 1);

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 0.5);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, f.life / 0.9);
    ctx.fillStyle = '#ff7a59';
    ctx.font = 'bold 20px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function updateEffects(dt) {
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const f of floaters) { f.y -= 40 * dt; f.life -= dt; }
  floaters = floaters.filter(f => f.life > 0);
}

// ===================== ИНТЕРФЕЙС =====================
function updateUI() {
  const its = items();
  document.getElementById('title').textContent = THEMES[theme].title;
  document.title = THEMES[theme].title;

  const curEmo = document.getElementById('curEmo');
  curEmo.textContent = its[cur].e; curEmo.style.background = its[cur].c;
  document.getElementById('curName').textContent = its[cur].n;

  const nextEmo = document.getElementById('nextEmo');
  nextEmo.textContent = its[nxt].e; nextEmo.style.background = its[nxt].c;
  document.getElementById('nextName').textContent = its[nxt].n;

  const chain = document.getElementById('chain');
  chain.innerHTML = '';
  its.forEach((it, i) => {
    const row = document.createElement('div');
    if (i <= Math.max(maxReached, 2)) row.className = 'done';
    const result = i < its.length - 1
      ? `<span class="e">${its[i + 1].e}</span>`
      : `<span class="e">💥</span>+${BIG_BONUS}`;
    row.innerHTML = `<span class="e">${it.e}</span>+<span class="e">${it.e}</span>→${result}`;
    row.title = i < its.length - 1 ? `${it.n} + ${it.n} = ${its[i + 1].n}` : `${it.n} + ${it.n} = бонус!`;
    chain.appendChild(row);
  });

  document.querySelectorAll('#themes button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.theme === theme);
  });
}

// Кнопки тем создаются один раз (раньше они пересоздавались во время игры и клик «терялся»)
(function buildThemeButtons() {
  const box = document.getElementById('themes');
  for (const key in THEMES) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = THEMES[key].button;
    btn.dataset.theme = key;
    btn.addEventListener('click', () => switchTheme(key));
    box.appendChild(btn);
  }
})();

function switchTheme(key) {
  if (key === theme) return;
  theme = key;
  newGame();
}

document.getElementById('newBtn').onclick = newGame;
document.getElementById('againBtn').onclick = newGame;
document.getElementById('guideToggle').onchange = e => { showGuide = e.target.checked; };

// ===================== ГЛАВНЫЙ ЦИКЛ =====================
const FIXED = 1 / 120;
let last = performance.now(), acc = 0;
function frame(t) {
  const dt = Math.min((t - last) / 1000, 0.05);
  last = t;
  if (!over) {
    acc += dt;
    while (acc >= FIXED) { step(FIXED); acc -= FIXED; }
    cooldown = Math.max(0, cooldown - dt);
    checkOver(dt);
  }
  updateEffects(dt);
  draw(t);
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = Math.max(best, score);
  requestAnimationFrame(frame);
}

newGame();
requestAnimationFrame(frame);
</script>
</body>
</html>
